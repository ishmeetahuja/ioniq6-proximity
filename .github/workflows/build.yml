name: Build APK and firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the release with the APK + firmware

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk ioniq6-autolock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ioniq6-autolock.apk

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio "esptool<5"
      - name: Build firmware
        run: pio run -d firmware
      - name: Merge into one file for the web flasher (flash at 0x0)
        run: |
          B=firmware/.pio/build/esp32dev
          python -m esptool --chip esp32 merge_bin -o esp32-car-tag.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: esp32-car-tag.bin

  release:
    needs: [android, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            ioniq6-autolock.apk esp32-car-tag.bin \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Install ioniq6-autolock.apk on the phone; flash esp32-car-tag.bin at address 0x0." \
            --latest
